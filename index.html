<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The mark flips with the OS appearance: favicon-light.svg is the black
         glyph for light tab bars, favicon-dark.svg the white one for dark tab
         bars. The light icon is listed first and unqualified so it also acts as
         the fallback in browsers that ignore media on link[rel=icon]. -->
    <link rel="icon" type="image/svg+xml" href="/favicon-light.svg" />
    <link rel="icon" type="image/svg+xml" href="/favicon-dark.svg" media="(prefers-color-scheme: dark)" />
    <title>Pro Bento</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
